name: Health_ebnjaOS_v2
options:
  bundleIdPrefix: com.benjaminlarrondo
configs:
  Debug: debug
  Release: release
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
targets:
  Health_ebnjaOS_v2:
    type: application
    platform: iOS
    deploymentTarget: 18.0
    sources:
      - path: App
      - path: Features
      - path: HealthKit
      - path: Supabase
      - path: Shared
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/CelesteCalendar
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: ebnjaOS
        UIRequiresFullScreen: true
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_SCHEME: $(SUPABASE_SCHEME)
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_PATH: $(SUPABASE_PATH)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        NSHealthShareUsageDescription: Health_ebnjaOS needs access to Apple Health to sync health, sleep, and training metrics with ebnjaOS.
        NSHealthUpdateUsageDescription: Health_ebnjaOS needs permission to store health sync metadata.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
    entitlements:
      path: Resources/Health_ebnjaOS.entitlements
      properties:
        com.apple.developer.healthkit: true
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ebnjaos.health
        PRODUCT_NAME: ebnjaOS
        INFOPLIST_KEY_CFBundleDisplayName: ebnjaOS
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Health_ebnjaOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - Health_ebnjaOS_v2Tests
  Health_ebnjaOS_v2Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 18.0
    sources:
      - path: Tests
    dependencies:
      - target: Health_ebnjaOS_v2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ebnjaos.healthTests
        PRODUCT_NAME: HealthTests
        SWIFT_VERSION: 6.0
